# Custom configuration

CONFIG_LOG=n
CONFIG_ASSERT=y

# CONFIG_AIR_FLASH=n
CONFIG_SERIAL=y
CONFIG_AIR_UART=y

CONFIG_UART_INTERRUPT_DRIVEN=n

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048

# Turn off multithreading, only main
CONFIG_MULTITHREADING=n
CONFIG_TIMESLICING=n

# cannot use NVS because of single thread cannot use mutex
CONFIG_NVS=n
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n


CONFIG_AIR_PARTITION_GEN_TABLE_ENABLE=n

# generated configs.c depends on FLASH_SIZE & FLASH_BASE_ADDRESS
CONFIG_XIP=y
CONFIG_IROM_BOOTING=y
CONFIG_FLASH_BOOTING=n
CONFIG_FLASH_SIZE=0
CONFIG_FLASH_BASE_ADDRESS=0x10000000



CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_DISASSEMBLE_ALL=y

CONFIG_WRAP_PRINTK=n

CONFIG_AIR_OST=y
CONFIG_CORTEX_M_SYSTICK=n

#LOG enable option.
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_FRONTEND=y
CONFIG_LOG_FRONTEND_ONLY=y
CONFIG_AIR_LOGGING_ENABLE=y
