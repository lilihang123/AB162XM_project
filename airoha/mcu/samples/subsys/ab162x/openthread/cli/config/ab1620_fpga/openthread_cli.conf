# Custom configuration

CONFIG_ASSERT=y

CONFIG_AIR_GPIO=n

CONFIG_AIR_FLASH=n
CONFIG_AIR_I2C=n

CONFIG_SERIAL=y
CONFIG_AIR_UART=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_EVENTS=n
CONFIG_POLL=n
CONFIG_PIPES=n


CONFIG_TINYCRYPT=n
CONFIG_TINYCRYPT_SHA256=n

CONFIG_JSON_LIBRARY=n

CONFIG_OUTPUT_DISASSEMBLY=n
CONFIG_OUTPUT_DISASSEMBLE_ALL=n

CONFIG_THREAD_MONITOR=n

CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=8
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n


#CONFIG_NUM_COOP_PRIORITIES=0
CONFIG_MAIN_THREAD_PRIORITY=8

# DUMB                    [0, 3]
# MULTIQ                  [4, 20]
# SCALABLE                >20
CONFIG_SCHED_MULTIQ=y
CONFIG_SCHED_DUMB=n
CONFIG_SCHED_SCALABLE=n

CONFIG_TICKLESS_KERNEL=n

# USB
CONFIG_AIR_USB=n
CONFIG_USB_DEVICE_DRIVER=n

# secure firmware
CONFIG_TRUSTED_EXECUTION_SECURE=y

# generate default nvkey binary file
CONFIG_GEN_DEFAULT_NVS_BIN=n
CONFIG_NVS_REPEAT_STRATEGY_USE_LAST=n

CONFIG_AIR_PARTITION_GEN_TABLE_ENABLE=y

# generated configs.c depends on FLASH_SIZE & FLASH_BASE_ADDRESS
# FLASH_SIZE & FLASH_BASE_ADDRESS depends on XIP
# So if XIP is not choose, FLASH_SIZE needs to be changed to 0 because of linker.ld template
CONFIG_XIP=n
CONFIG_TCM_BOOTING=y
CONFIG_FLASH_SIZE=0
CONFIG_FLASH_BASE_ADDRESS=0x08000000


# CONFIG_AIR_RISCV_PROJ_PATH="projects/templates/hello_world"
# CONFIG_AIR_RISCV_FEATURE="config/feature.mk"

CONFIG_AIR_WDT=n
# CONFIG_AIR_WDT_2ND=y
CONFIG_WRAP_PRINTK=y

CONFIG_AIR_TRNG_ENABLE=y
CONFIG_AIR_HW_SEMAPHORE=y

# Enable openthread
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_AIR_ENTROPY_ENABLE=y

CONFIG_NETWORKING=y

# Network shell
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416

CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="uart:~$ "
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
# enable this feature so that output logging from shell uart device
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_LOG=n
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_DEBG=y
CONFIG_OPENTHREAD_DIAG=y

CONFIG_AIR_AVM=y
CONFIG_BT=y
CONFIG_BT_PKA_LIB_MULTI_PROTOCOL=y

CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256_HMAC=y
CONFIG_TINYCRYPT_ECC_DH=y
CONFIG_TINYCRYPT_AES_CTR=y

#ENABLE SETTING
CONFIG_AIR_NVKEY_ENABLE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_AIR_FLASH=y
# Settings depends on FLASH_MAP & FLASH_PAGE_LAYOUT
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_3_1=y
CONFIG_IEEE802154_AIR_ENCRYPTION=y
#CONFIG_OPENTHREAD_MTD=y

CONFIG_OPENTHREAD_MANUAL_START=y