CONFIG_OPENTHREAD_THREAD_VERSION_1_3_1=y
CONFIG_OPENTHREAD_SOURCES=n
CONFIG_OPENTHREAD_LIBRARY=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_AIR_OPENTHREAD_LIBRARY_MTD=y
#################    OpenThread pre-build lib end #####################
# for performance, no log when disable log by nvkey.
CONFIG_AIR_BYPASS_SYSLOG_WITH_LOG_FLOW_ENABLE=n
# Low Power Config
CONFIG_AIR_PADDING_AROUND_RAM_TEXT_ENABLE=y
CONFIG_AIR_PADDING_AROUND_RAM_TEXT_ALIGNMENT_16K=y
CONFIG_AIR_RAM_BLOCKS_CONTROL_ENABLE=y