# Custom configuration

CONFIG_ASSERT=y

CONFIG_AIR_GPIO=n

CONFIG_AIR_FLASH=n
CONFIG_AIR_UART=n
CONFIG_AIR_I2C=y


CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_EVENTS=n
CONFIG_POLL=n
CONFIG_PIPES=n


CONFIG_TINYCRYPT=n
CONFIG_TINYCRYPT_SHA256=n

CONFIG_JSON_LIBRARY=n

CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_DISASSEMBLE_ALL=n

CONFIG_THREAD_MONITOR=n

CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=8
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=n


CONFIG_AIR_NVKEY_ENABLE=n

CONFIG_NUM_COOP_PRIORITIES=0
CONFIG_MAIN_THREAD_PRIORITY=8

# DUMB                    [0, 3]
# MULTIQ                  [4, 20]
# SCALABLE                >20
CONFIG_SCHED_MULTIQ=y
CONFIG_SCHED_DUMB=n
CONFIG_SCHED_SCALABLE=n

CONFIG_TICKLESS_KERNEL=n

# USB
CONFIG_AIR_USB=n
CONFIG_USB_DEVICE_DRIVER=n

# secure firmware
CONFIG_TRUSTED_EXECUTION_SECURE=y

# generate default nvkey binary file
CONFIG_GEN_DEFAULT_NVS_BIN=n
CONFIG_NVS_REPEAT_STRATEGY_USE_LAST=n

CONFIG_AIR_PARTITION_GEN_TABLE_ENABLE=y

# generated configs.c depends on FLASH_SIZE & FLASH_BASE_ADDRESS
# FLASH_SIZE & FLASH_BASE_ADDRESS depends on XIP
# So if XIP is not choose, FLASH_SIZE needs to be changed to 0 because of linker.ld template
CONFIG_XIP=n
CONFIG_TCM_BOOTING=y
CONFIG_FLASH_SIZE=0
CONFIG_FLASH_BASE_ADDRESS=0x08000000


# Logging
# CONFIG_LOG=y
# CONFIG_LOG_PRINTK=y
# CONFIG_LOG_FRONTEND=y
# CONFIG_LOG_FRONTEND_ONLY=y
# CONFIG_AIR_LOGGING_ENABLE=y
# CONFIG_AIR_SHARE_BUFFER_ENABLE=y
CONFIG_WRAP_PRINTK=n

CONFIG_AIR_MUX_ENABLE=y
CONFIG_MULTITHREADING=y
CONFIG_AIR_HW_SEMAPHORE=y

# USB General Config
CONFIG_AIR_USB=y
CONFIG_USB_DEVICE_DRIVER=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_SOF=y

# Airoha USB Subsys Config
CONFIG_AIR_USB_ENABLE=y
CONFIG_AIR_USB_HID_ENABLE=y

# USB HID Config
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=3
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_HID_INTERRUPT_EP_MPS=64
CONFIG_USB_HID_REPORTS=1
CONFIG_ENABLE_HID_INT_OUT_EP=y

# USB Driver Debug Log
CONFIG_USB_DEVICE_LOG_LEVEL_DBG=n
CONFIG_USB_HID_LOG_LEVEL_DBG=n

# USB Custom Config
CONFIG_USB_DEVICE_PRODUCT="Airoha HID Demo Project"
CONFIG_USB_DEVICE_MANUFACTURER=""
CONFIG_USB_DEVICE_VID=0x0E8D
CONFIG_USB_DEVICE_PID=0x0880
