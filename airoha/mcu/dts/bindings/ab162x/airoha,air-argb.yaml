description: |
    Airoha ARGB
    middle Implement ARGB

compatible: "airoha,air-argb"

include: base.yaml

properties:

    argb_channel:
        type: int
        description: |
            GPIO number Control

    one_h_value:
        type: int
        default: 595
        description: |
            one_h_value

    one_l_value:
        type: int
        default: 295
        description: |
            one_l_value

    zero_h_value:
        type: int
        default: 295
        description: |
            zero_h_value

    zero_l_value:
        type: int
        default: 595
        description: |
            zero_l_value

    reset_value:
        type: int
        default: 80000
        description: |
            reset_value

    pat_cnt:
        type: int
        default: 16
        description: |
            pat_cnt

    bit_nonrev:
        type: int
        default: 1
        description: |
            bit_nonrev

    ed_big:
        type: int
        default: 1
        description: |
            ed_big

    nonalign:
        type: int
        default: 1
        description: |
            nonalign

    auto_timer_val:
        type: int
        default: 16000000
        description: |
            auto_timer_val

    dma_start_val:
        type: int
        default: 12000000
        description: |
            dma_start_val

    pre_wake_val:
        type: int
        default: 1000000
        description: |
            pre_wake_val