description: Airoha Flash Partitions

compatible: "airoha,air-flash-partitions"

include: fixed-partitions.yaml

child-binding:
  description: |
    Each child node of the fixed-partitions node represents
    an individual flash partition. These should usually
    look like this:

      partition_nodelabel: partition@START_OFFSET {
              label = "human-readable-name";
              reg = <0xSTART_OFFSET 0xSIZE>;
      };
  properties:
    label:
      type: string
      description: |
        Human readable string describing the flash partition.
      required: true
    read-only:
      type: boolean
      description: set this property if the partition is read-only
    cacheable:
      type: boolean
      description: set this property if the partition is cacheable
    immutable:
      type: boolean
      description: set this property if the partition is immutable
    reg:
      type: array
      description: |
        This should be in the format <OFFSET SIZE>, where OFFSET
        is the offset of the flash partition relative to the base
        address of the parent memory, and SIZE is the size of
        the partition in bytes.
      required: true
    download:
      type: boolean
      description: indicate whether the partition has a binary file that can be downloaded
    display_name:
      type: string
      description: the name displayed on the download tool of this partition
    id:
      type: int
      description: the unique id of this partition
      required: true
    customized_data:
      type: array
      description: data reserved for customers to customize