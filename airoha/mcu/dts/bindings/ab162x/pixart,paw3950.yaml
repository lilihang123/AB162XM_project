description: |
    This is a representation of the PAW3950 optical motion sensor

compatible: "pixart,paw3950"

# include: airoha,air-spim.yaml

properties:
    reg:
      type: int
      required: true
    lod:
      type: string
      enum:
          - lift_cut_off_1mm
          - lift_cut_off_2mm
          - lift_cut_off_0_7mm
      default: lift_cut_off_1mm
      description: |
        LIFT CUT OFF,LOD
    cpi:
      type: int
      default: 5000
      description: |
        value:50~26000
    mode:
      type: string
      enum:
        - high-performance
        - low-power
        - office
        - cord
      default: high-performance
      description: |
          Sensor mode
    xy_direction:
      type: string
      enum:
        - swap_xy
        - inv_y
        - inv_x
        - inv_xy
        - inv_x_and_swap_xy
        - inv_y_and_swap_xy
        - inv_xy_and_swap_xy
        - not_inv_and_not_swap
        - no_direction_adjustment
      default: no_direction_adjustment
      description: |
          Sensor direction
    rest_mode:
      type: int
      description: |
          determine whether the sensor enters rest mode
    motion_sync:
      type: int
      description: |
          determine whether the sensor enable motion sync
    ripple_control:
      type: int
      description: |
          determine whether the sensor enable ripple control
    angle_snap:
      type: int
      description: |
          determine whether the sensor enable angle snap
    rest1_period_time:
      type: int
      default: 1
      description: |
          rest1 led period time is : rest1_period_reg * 1, unit:ms
          rest1_period_reg value 1~255,default 1*1 = 1 ms,
          this value 1~255 ms
    rest2_period_time:
      type: int
      default: 20
      description: |
          rest2 led period time is : rest2_period_reg * 4, unit:ms
          rest2_period_reg value 1~255,default 5*4 = 20 ms
          this value 4~1020 ms
    rest3_period_time:
      type: int
      default: 160
      description: |
          rest3 led period time is : rest3_period_reg * 8, unit:ms
          rest3_period_reg 1~255,default 20*8 = 160 ms
          this value 8~2040 ms
    nreset_pin:
      type: int
      default: 0xff
      description: |
          sensor_nreset pin number