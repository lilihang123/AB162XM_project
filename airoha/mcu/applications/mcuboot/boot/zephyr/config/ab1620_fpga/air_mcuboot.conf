
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y

CONFIG_ARM_MPU=n
CONFIG_AIR_CACHE=y
CONFIG_AIR_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_BUILD_OUTPUT_HEX=y

CONFIG_TCM_BOOTING=y
CONFIG_FLASH_BOOTING=n
CONFIG_XIP=n
CONFIG_FLASH_SIZE=0
CONFIG_FLASH_BASE_ADDRESS=0x08000000

# firmware header is reset_handler because of BROM jump method
CONFIG_AIR_STD_ARM_BOOT_METHOD_ENABLE=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BOOT_SIGNATURE_TYPE_AES=n
CONFIG_BOOT_HW_KEY=n
CONFIG_BOOT_SIGNATURE_TYPE_RSA_LEN=3072

# mcuboot should not using cross core memory
CONFIG_AIR_SOC_CROSS_CORE_MEMORY_ENABLE=n
CONFIG_AIR_CCNI=n

CONFIG_AIR_BL_DFU_ENABLE=n